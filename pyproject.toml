[project]
name = "honeypot-eval"
version = "0.1.0"
description = "A small open scheming honeypot evaluation built in Inspect, after Krakovna et al. (2026)"
readme = "README.md"
authors = [
    { name = "coffeeandcodee", email = "a9idris@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.281",
    "openai>=3.33.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]